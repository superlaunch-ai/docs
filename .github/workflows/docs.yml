name: Documentation checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 -m pip install -r requirements-checks.txt
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/verify_docs.py
      - run: python3 scripts/generate_llms.py --check
      - run: python3 scripts/generate_tool_reference.py --check
